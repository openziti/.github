name: Post Event to Mattermost
on:
  create:
  delete:
  issues:
    types:
      - opened
      - closed
      - reopened
  issue_comment:
  pull_request_review:
    types:
      - submitted
  pull_request_review_comment:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed
  push:
    branches:
      - '**'
  fork:
  release:
    types:
      - released
  workflow_dispatch:
  watch:
    types:
      - started

permissions:
  contents: read

jobs:
  mattermost_webhook:
    runs-on: ubuntu-latest
    name: Ziti Mattermost Action - Py
    # a chat notification must never fail the caller's checks
    continue-on-error: true
    # the webhook is dialed over the ziti overlay, so cap the job in case it hangs
    timeout-minutes: 5
    steps:
    - uses: openziti/ziti-mattermost-action-py@main
      with:
        # Identity JSON or Base64 encoded JSON
        zitiId: ${{ secrets.ZITI_MATTERMOST_IDENTITY }}

        # http://<ziti service intercept address>/hooks/<incoming webhook secret token>
        # http://mattermost.ziti.internal:80/hooks/asdflkhjasdflkhjasdflkhjasdflkhj
        # one URL per line to post to more than one channel
        webhookUrl: ${{ secrets.ZHOOK_URL_DEV_NOTIFICATIONS }}

        # Event JSON or Base64 encoded JSON
        eventJson: ${{ toJson(github.event) }}

        # Sender username to spoof in Mattermost
        senderUsername: GitHubZ

        # In Mattermost server, the incoming webhook URL must be configured to allow this specific channel or all
        # channels
        destChannel: dev-notifications

