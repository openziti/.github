name: Post Event to Mattermost
on:
  create:
  delete:
  issues:
    types:
      - opened
      - closed
      - reopened
  issue_comment:
  pull_request_review:
    types:
      - submitted
  pull_request_review_comment:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed
  push:
    branches:
      - '**'
  fork:
  release:
    types:
      - released
  workflow_dispatch:
  watch:
    types:
      - started

permissions:
  contents: read

jobs:
  mattermost_webhook:
    uses: openziti/.github/.github/workflows/mattermost-channel-posts.yml@main
    secrets:
      ZITI_MATTERMOST_IDENTITY: ${{ secrets.ZITI_MATTERMOST_IDENTITY }}
      webhookUrl: ${{ secrets.ZHOOK_URL_DEV_NOTIFICATIONS }}
